version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.25.12"

linters:
  default: none

  enable:
    # correctness / bug finding
    - bodyclose
    - contextcheck
    - copyloopvar
    - err113
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilerr
    - nilnil
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unparam
    - unused

    # maintainability / readability
    - dupl
    - exhaustive
    - funlen
    - gocognit
    - gocyclo
    - interfacebloat
    - lll
    - misspell
    - nakedret
    - nestif
    - nolintlint
    - nonamedreturns
    - prealloc
    - revive
    - unconvert
    - whitespace
    - dogsled
    - makezero

    # engineering discipline
    - forbidigo
    - wrapcheck

    # architecture / safety
    - depguard
    - gochecknoinits
    - predeclared
    - asasalint
    - canonicalheader
    - fatcontext

  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy

    rules:
      - path: '(.+)_test\.go'
        linters:
          - dupl
          - err113
          - errcheck
          - funlen
          - gochecknoinits
          - gocognit
          - gocyclo
          - lll
          - nestif
          - wrapcheck

      # 这些包通过 init 向 BlockIO 注册表注册实现。
      - path: 'blockio/(localfile|mem|telegram)/'
        linters:
          - gochecknoinits

      # Gin mode 是进程级框架设置，必须早于 engine 初始化。
      - path: 'server/server\.go'
        linters:
          - gochecknoinits

      # cmd 是 CLI 入口，标准输出/错误输出属于用户协议，不是调试日志。
      - path: 'cmd/'
        linters:
          - forbidigo
          - wrapcheck

      - path: '(^|/)(mock|mocks|testdata|vendor)/'
        linters:
          - dupl
          - gosec
          - lll
          - revive

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.Copy
        - io.CopyBuffer
        - io.CopyN
        - github.com/xxxsen/common/logutil.Sync
        - go.uber.org/zap.(*Logger).Sync
        - go.uber.org/zap.(*SugaredLogger).Sync

    copyloopvar:
      check-alias: true

    dupl:
      threshold: 120

    funlen:
      lines: 80
      statements: 50

    gocognit:
      min-complexity: 25

    gocyclo:
      min-complexity: 15

    interfacebloat:
      max: 5

    lll:
      line-length: 120
      tab-width: 2

    misspell:
      locale: US

    nestif:
      min-complexity: 4

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    nonamedreturns:
      report-error-in-defer: true

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    makezero:
      always: false

    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
      ignore-package-globs:
        - encoding/*
        - github.com/pkg/errors

    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: "不要提交调试输出，改用结构化日志"
        - pattern: '^print(ln)?$'
          msg: "不要使用内建 print/println"

    depguard:
      rules:
        entity-is-leaf:
          files:
            - "**/entity/**"
          allow:
            - $gostd

        server-model-is-leaf:
          files:
            - "**/server/model/**"
          allow:
            - $gostd

        no-import-cmd:
          files:
            - "!**/cmd/**"
          deny:
            - pkg: github.com/xxxsen/tgfile/cmd
              desc: "cmd 是组装入口，其他包不得反向依赖"

    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
        - name: empty-block
        - name: empty-lines
        - name: error-naming
        - name: error-return
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-parameter
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: redundant-import-alias
        - name: string-of-int
        - name: superfluous-else
        - name: time-equal
        - name: time-naming
        - name: unnecessary-if
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
          arguments:
            - allow-regex: "^_"
        - name: use-any
        - name: use-errors-new
        - name: use-waitgroup-go

formatters:
  enable:
    - gofumpt
    - goimports

  settings:
    gofumpt:
      extra-rules: true
      module-path: github.com/xxxsen/tgfile

    goimports:
      local-prefixes:
        - github.com/xxxsen/tgfile

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

severity:
  default: error
